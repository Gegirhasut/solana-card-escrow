[project]
name = "card-escrow-backend"
version = "0.1.0"
description = "Simulated card-issuer integration for the card_escrow Solana program"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "redis==8.1.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "solana==0.41.0",
    "solders==0.29.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "asgi-lifespan==2.1.0",
]

[project.scripts]
escrow-backend = "escrow_backend.cli:main"
mock-issuer = "escrow_backend.mock_issuer.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escrow_backend"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires a local validator with the program deployed (scripts/localnet.sh)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["escrow_backend"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
cache-dir = "~/.cache/card-escrow-ruff"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
