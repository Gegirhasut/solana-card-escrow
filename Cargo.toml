[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Optimize the on-chain program for size: deployment rent is ~6960 lamports
# per byte, so every KB saved is ~0.007 SOL less locked on mainnet.
[profile.release.package.card-escrow]
opt-level = "z"
